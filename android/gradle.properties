# Release 构建比 Debug 慢是正常现象，不代表构建卡死：Release 还会执行 lintVital、R8
# 代码压缩、资源优化，以及多个 ABI 的 CMake/JNI 原生构建；首次构建或缓存失效时更明显。
# 当前 Gradle/AGP 使用 JDK 17 更稳定。若构建异常缓慢或失败，请先确认 JAVA_HOME 指向 JDK 17，
# Android Studio 没有开启 Gradle Offline Mode，并确认 Gradle 缓存使用 C:\Users\Administrator\.gradle。
# 同一时间不要重复启动多个 Gradle 构建；必要时可在 android 目录执行 gradlew.bat --stop。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
